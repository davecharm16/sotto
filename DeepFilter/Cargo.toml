[package]
name = "deepfilter-ffi"
version = "0.1.0"
edition = "2021"

[lib]
name = "deepfilter"
crate-type = ["staticlib"]

[dependencies]
tract-onnx = "0.21"
tract-core = "0.21"
ndarray = "0.15"
realfft = "3.3"
num-complex = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
